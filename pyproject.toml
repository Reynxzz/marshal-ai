[project]
name = "marshal-ai"
version = "0.1.0"
description = "Gemini agents that run a car plant's yard, inspections and driving-system tests. The agents never drive."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "truststore>=0.9",
    # Backend data layer (docs-be/ERD_AND_DATA_MODELING.md)
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "python-ulid>=3.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    # Control Tower API (docs-be/BACKEND_SCAFFOLDING_PLAN.md)
    "fastapi>=0.115",
    "pydantic-settings>=2.2",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# PostgreSQL driver for staging/production (`postgresql+asyncpg://` URLs).
postgres = [
    "asyncpg>=0.29",
]
gcp = [
    "google-cloud-pubsub>=2.21",
    "google-cloud-firestore>=2.16",
    "google-cloud-storage>=2.14",
    "google-cloud-bigquery>=3.17",
]
# The CARLA client matches the server version on the GPU VM; install it there only.
carla = [
    "carla==0.9.16",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marshal_ai", "src/marshal_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
