# Generated by scripts/load_plant_world.py --write-map: plant_map.yaml with every point's
# CARLA transform on the plant's own world (scripts/plant_xodr.py). Do not edit by hand.

# Plant map: named points, zones and drivable segments.
#
# Coordinates are metres in a local plant frame. `carla` holds the matching
# CARLA world transform; fill it in on the VM once the CARLA map is chosen
# (scripts/pick_carla_points.py prints spawn points to pick from).
# Scenario specs and missions refer to points only by name, never by coordinate.

carla_map: OpenDriveMap   # the plant's own world, MARSHAL_CARLA_MAP=MarshalPlant

zones:
  line_end:          {description: End of the assembly line; cars wait here for release}
  inspection_gate:   {description: Four-camera drive-through gate, 5 km/h}
  test_track:        {description: Functional check routine (lights, reverse, brake test)}
  finishing:         {description: Finishing lane between test track and yard}
  finishing_corner:  {description: Blind corner into finishing, forklift traffic}
  rework:            {description: Rework bays}
  buffer_zone_b:     {description: Overflow parking for untested or held cars}
  yard:              {description: Outbound yard, slots grouped by truck}

points:
  line_end:            {zone: line_end,         x: 0,   y: 0, carla: {x: 8.0, y: 5.25, z: 0.5, yaw: -0.0}}
  inspection_gate:     {zone: inspection_gate,  x: 40,  y: 0, carla: {x: 32.0, y: 5.25, z: 0.5, yaw: -0.0}}
  test_track:          {zone: test_track,       x: 90,  y: 0, carla: {x: 62.0, y: 5.25, z: 0.5, yaw: -0.0}}
  report_point:        {zone: test_track,       x: 130, y: 0, carla: {x: 100.0, y: 5.25, z: 0.5, yaw: -0.0}}
  finishing_corner.p1: {zone: finishing_corner, x: 145, y: 3, carla: {x: 146.5, y: -88.36, z: 0.5, yaw: -103.5}}
  finishing_corner.p2: {zone: finishing_corner, x: 153, y: 9, carla: {x: 139.27, y: -101.27, z: 0.5, yaw: -135.0}}
  finishing_corner.p3: {zone: finishing_corner, x: 158, y: 18, carla: {x: 126.36, y: -108.5, z: 0.5, yaw: -166.5}}
  finishing:           {zone: finishing,        x: 160, y: 40, carla: {x: 90.0, y: -109.25, z: 0.5, yaw: -180.0}}
  lane_c:              {zone: finishing,        x: 130, y: 40, carla: {x: 117.25, y: -50.0, z: 0.5, yaw: -90.0}}
  buffer_zone_b:       {zone: buffer_zone_b,    x: 20,  y: 40, carla: {x: 18.0, y: 5.25, z: 0.5, yaw: -0.0}}
# Bays and yard slots are on the road's 3.5 m shoulder (Town05 road 34, lane -4), in the order a car
# reaches them after the report point, 9 m apart. They used to be in the driving lanes, and ten of the
# thirteen lay on another car's route: with several cars, a car parked in production control blocked
# the next car's drive to the yard, and it waited behind it for good. No route uses the shoulder. A car
# reaches a pull_over point by driving to the lane beside it and then pulling over (carla_backend).
  rework.paint:        {zone: rework,           x: 100, y: -40, carla: {x: 150.75, y: -60.0, z: 0.5, yaw: -90.0, pull_over: true}}
  rework.body:         {zone: rework,           x: 115, y: -40, carla: {x: 150.75, y: -50.0, z: 0.5, yaw: -90.0, pull_over: true}}
  rework.electrical:   {zone: rework,           x: 130, y: -40, carla: {x: 150.75, y: -40.0, z: 0.5, yaw: -90.0, pull_over: true}}
  rework.mechanical:   {zone: rework,           x: 145, y: -40, carla: {x: 150.75, y: -30.0, z: 0.5, yaw: -90.0, pull_over: true}}
  production_control:  {zone: rework,           x: 160, y: -40, carla: {x: 150.75, y: -72.0, z: 0.5, yaw: -90.0, pull_over: true}}
  yard.entry:          {zone: yard,             x: 200, y: 40, carla: {x: -27.25, y: -80.0, z: 0.5, yaw: -270.0}}
  yard.Y1:             {zone: yard,             x: 210, y: 30, carla: {x: -30.75, y: -68.0, z: 0.5, yaw: -270.0, pull_over: true}}
  yard.Y2:             {zone: yard,             x: 210, y: 36, carla: {x: -30.75, y: -62.5, z: 0.5, yaw: -270.0, pull_over: true}}
  yard.Y3:             {zone: yard,             x: 210, y: 42, carla: {x: -30.75, y: -57.0, z: 0.5, yaw: -270.0, pull_over: true}}
  yard.Y4:             {zone: yard,             x: 210, y: 48, carla: {x: -30.75, y: -51.5, z: 0.5, yaw: -270.0, pull_over: true}}
  yard.Y5:             {zone: yard,             x: 220, y: 30, carla: {x: -30.75, y: -46.0, z: 0.5, yaw: -270.0, pull_over: true}}
  yard.Y6:             {zone: yard,             x: 220, y: 36, carla: {x: -30.75, y: -40.5, z: 0.5, yaw: -270.0, pull_over: true}}
  yard.Y7:             {zone: yard,             x: 220, y: 42, carla: {x: -30.75, y: -35.0, z: 0.5, yaw: -270.0, pull_over: true}}
  yard.Y8:             {zone: yard,             x: 220, y: 48, carla: {x: -30.75, y: -29.5, z: 0.5, yaw: -270.0, pull_over: true}}
  loading_bay:         {zone: yard,             x: 240, y: 40, carla: {x: -27.25, y: -26.0, z: 0.5, yaw: -270.0}}

# Drivable segments, both directions unless one_way is set.
# Buffer zone B only connects to line end: untested cars cannot bypass the gate.
segments:
  - [line_end, inspection_gate]
  - [line_end, buffer_zone_b]
  - [inspection_gate, test_track]
  - [test_track, report_point]
  - [report_point, finishing_corner.p1]
  - [finishing_corner.p1, finishing_corner.p2]
  - [finishing_corner.p2, finishing_corner.p3]
  - [finishing_corner.p3, finishing]
  - [report_point, lane_c]
  - [lane_c, finishing]
  - {from: report_point, to: rework.paint, one_way: true}
  - [rework.paint, rework.body]
  - [rework.body, rework.electrical]
  - [rework.electrical, rework.mechanical]
  - [rework.mechanical, production_control]
  - {from: rework.paint, to: inspection_gate, one_way: true}   # repaired cars are re-inspected
  - [finishing, yard.entry]
  - [yard.entry, yard.Y1]
  - [yard.entry, yard.Y2]
  - [yard.entry, yard.Y3]
  - [yard.entry, yard.Y4]
  - [yard.entry, yard.Y5]
  - [yard.entry, yard.Y6]
  - [yard.entry, yard.Y7]
  - [yard.entry, yard.Y8]
  - [yard.entry, loading_bay]
