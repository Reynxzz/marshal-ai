# Plant map: named points, zones and drivable segments.
#
# Coordinates are metres in a local plant frame. `carla` holds the matching
# CARLA world transform; fill it in on the VM once the CARLA map is chosen
# (scripts/pick_carla_points.py prints spawn points to pick from).
# Scenario specs and missions refer to points only by name, never by coordinate.

carla_map: Town05   # placeholder until the plant layout map is chosen

zones:
  line_end:          {description: End of the assembly line; cars wait here for release}
  inspection_gate:   {description: Four-camera drive-through gate, 5 km/h}
  test_track:        {description: Functional check routine (lights, reverse, brake test)}
  finishing:         {description: Finishing lane between test track and yard}
  finishing_corner:  {description: Blind corner into finishing, forklift traffic}
  rework:            {description: Rework bays}
  buffer_zone_b:     {description: Overflow parking for untested or held cars}
  yard:              {description: Outbound yard, slots grouped by truck}

points:
  line_end:            {zone: line_end,         x: 0,   y: 0,   carla: {x: 207.27, y: -13.93, z: 0.30, yaw: -90.7}}
  inspection_gate:     {zone: inspection_gate,  x: 40,  y: 0,   carla: {x: 206.97, y: -33.93, z: 0.50, yaw: -90.7}}
  test_track:          {zone: test_track,       x: 90,  y: 0,   carla: {x: 206.74, y: -53.93, z: 0.50, yaw: -90.7}}
  report_point:        {zone: test_track,       x: 130, y: 0,   carla: {x: 206.51, y: -73.93, z: 0.50, yaw: -90.7}}
  finishing_corner.p1: {zone: finishing_corner, x: 145, y: 3,   carla: {x: 204.93, y: -114.62, z: 0.50, yaw: -98.9}}
  finishing_corner.p2: {zone: finishing_corner, x: 153, y: 9,   carla: {x: 199.64, y: -134.95, z: 0.50, yaw: -110.3}}
  finishing_corner.p3: {zone: finishing_corner, x: 158, y: 18,  carla: {x: 190.45, y: -153.83, z: 0.50, yaw: -121.6}}
  finishing:           {zone: finishing,        x: 160, y: 40,  carla: {x: 177.72, y: -170.54, z: 0.50, yaw: -133.0}}
  lane_c:              {zone: finishing,        x: 130, y: 40,  carla: {x: 203.01, y: -73.89, z: 0.50, yaw: -90.7}}
  buffer_zone_b:       {zone: buffer_zone_b,    x: 20,  y: 40,  carla: {x: 207.07, y: -25.93, z: 0.50, yaw: -90.7}}
# Bays and yard slots are on the road's 3.5 m shoulder (Town05 road 34, lane -4), in the order a car
# reaches them after the report point, 9 m apart. They used to be in the driving lanes, and ten of the
# thirteen lay on another car's route: with several cars, a car parked in production control blocked
# the next car's drive to the yard, and it waited behind it for good. No route uses the shoulder. A car
# reaches a pull_over point by driving to the lane beside it and then pulling over (carla_backend).
  rework.paint:        {zone: rework,           x: 100, y: -40, carla: {x: 211.67, y: -116.81, z: 0.50, yaw: -99.5, pull_over: true}}
  rework.body:         {zone: rework,           x: 115, y: -40, carla: {x: 212.89, y: -106.80, z: 0.50, yaw: -94.4, pull_over: true}}
  rework.electrical:   {zone: rework,           x: 130, y: -40, carla: {x: 213.34, y: -88.01, z: 0.50, yaw: -90.7, pull_over: true}}
  rework.mechanical:   {zone: rework,           x: 145, y: -40, carla: {x: 213.24, y: -97.01, z: 0.50, yaw: -90.7, pull_over: true}}
  production_control:  {zone: rework,           x: 160, y: -40, carla: {x: 209.56, y: -126.68, z: 0.50, yaw: -104.6, pull_over: true}}
  yard.entry:          {zone: yard,             x: 200, y: 40,  carla: {x: 204.34, y: -132.05, z: 0.50, yaw: -108.0}}
  yard.Y1:             {zone: yard,             x: 210, y: 30,  carla: {x: 206.59, y: -136.32, z: 0.50, yaw: -109.7, pull_over: true}}
  yard.Y2:             {zone: yard,             x: 210, y: 36,  carla: {x: 202.76, y: -145.65, z: 0.50, yaw: -114.8, pull_over: true}}
  yard.Y3:             {zone: yard,             x: 210, y: 42,  carla: {x: 198.13, y: -154.61, z: 0.50, yaw: -119.9, pull_over: true}}
  yard.Y4:             {zone: yard,             x: 210, y: 48,  carla: {x: 192.71, y: -163.12, z: 0.50, yaw: -125.0, pull_over: true}}
  yard.Y5:             {zone: yard,             x: 220, y: 30,  carla: {x: 186.56, y: -171.12, z: 0.50, yaw: -130.1, pull_over: true}}
  yard.Y6:             {zone: yard,             x: 220, y: 36,  carla: {x: 179.72, y: -178.54, z: 0.50, yaw: -135.2, pull_over: true}}
  yard.Y7:             {zone: yard,             x: 220, y: 42,  carla: {x: 172.25, y: -185.31, z: 0.50, yaw: -140.3, pull_over: true}}
  yard.Y8:             {zone: yard,             x: 220, y: 48,  carla: {x: 164.20, y: -191.40, z: 0.50, yaw: -145.4, pull_over: true}}
  loading_bay:         {zone: yard,             x: 240, y: 40,  carla: {x: 172.49, y: -180.50, z: 0.50, yaw: -138.6}}

# Drivable segments, both directions unless one_way is set.
# Buffer zone B only connects to line end: untested cars cannot bypass the gate.
segments:
  - [line_end, inspection_gate]
  - [line_end, buffer_zone_b]
  - [inspection_gate, test_track]
  - [test_track, report_point]
  - [report_point, finishing_corner.p1]
  - [finishing_corner.p1, finishing_corner.p2]
  - [finishing_corner.p2, finishing_corner.p3]
  - [finishing_corner.p3, finishing]
  - [report_point, lane_c]
  - [lane_c, finishing]
  - {from: report_point, to: rework.paint, one_way: true}
  - [rework.paint, rework.body]
  - [rework.body, rework.electrical]
  - [rework.electrical, rework.mechanical]
  - [rework.mechanical, production_control]
  - {from: rework.paint, to: inspection_gate, one_way: true}   # repaired cars are re-inspected
  - [finishing, yard.entry]
  - [yard.entry, yard.Y1]
  - [yard.entry, yard.Y2]
  - [yard.entry, yard.Y3]
  - [yard.entry, yard.Y4]
  - [yard.entry, yard.Y5]
  - [yard.entry, yard.Y6]
  - [yard.entry, yard.Y7]
  - [yard.entry, yard.Y8]
  - [yard.entry, loading_bay]
